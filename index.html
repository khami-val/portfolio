<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Builder & Lead</title>
  <style>
    /* Системные переменные для консистентности */
    :root {
      --hot: #FF2D55;
      --lime: #BFFF00;
      --cyan: #00F0FF;
      --bg-dark: #0A0A0A;
      --text-main: #FFFFFF;
      --text-muted: #A0A0A0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 2rem;
      line-height: 1.5;
    }

    /* Сетка Bento */
    .bento-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* Секция Hero / Profile */
    .hero-bento {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      padding: 3rem 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 3rem;
    }

    /* Интерактивная рамка для фото */
    .profile-photo-wrapper {
      width: 150px;
      height: 150px;
      border-radius: 16px;
      position: relative;
      padding: 4px;
      background: linear-gradient(45deg, var(--hot), var(--cyan));
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
      overflow: hidden;
      flex-shrink: 0;
    }

    .profile-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid var(--bg-dark);
      transition: transform 0.3s ease;
    }

    /* Hover-эффекты для рамки */
    .profile-photo-wrapper:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 10px 20px rgba(255, 45, 85, 0.3), 
                  0 0 15px rgba(0, 240, 255, 0.4);
    }

    .profile-photo-wrapper:hover .profile-img {
      transform: scale(1.1);
    }

    /* Сетка статистики */
    .stats-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      flex-grow: 1;
    }

    .stat-block {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex: 1 1 200px;
      transition: border-color 0.3s ease;
    }

    .stat-block:hover {
      border-color: rgba(255, 255, 255, 0.3);
    }

    .stat-value {
      color: var(--cyan);
      font-size: 2.5rem;
      font-weight: 800;
      line-height: 1;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 500;
    }

    /* Секция Who am I */
    .bento-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      padding: 3rem 2rem;
    }

    .section-title {
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 0.875rem;
      margin-bottom: 2rem;
    }

    .system-hook {
      font-size: clamp(2rem, 4vw, 3.5rem);
      font-weight: 800;
      line-height: 1.1;
      background: linear-gradient(90deg, #FFFFFF, var(--lime));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1.5rem;
      max-width: 800px;
    }

    .sub-text {
      color: var(--text-muted);
      font-size: 1.25rem;
      max-width: 600px;
      line-height: 1.6;
    }

    @media (max-width: 768px) {
      .hero-bento {
        flex-direction: column;
        align-items: flex-start;
        gap: 2rem;
      }
      .stats-grid {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <main class="bento-container">
    
    <!-- Секция Hero / Profile -->
    <section class="hero-bento">
      <div class="profile-photo-wrapper">
        <!-- Замени путь на актуальный для твоего репозитория -->
        <img src="assets/profile-optimized.webp" alt="Profile" class="profile-img">
      </div>

      <div class="stats-grid">
        <div class="stat-block">
          <span class="stat-value">2y</span>
          <span class="stat-label">Lead Experience (iGaming)</span>
        </div>
        <div class="stat-block">
          <span class="stat-value">1y</span>
          <span class="stat-label">Team Lead Sales (Czech desk / Nutra)</span>
        </div>
      </div>
    </section>

    <!-- Секция Who am I -->
    <section id="who-am-i" class="bento-box">
      <h2 class="section-title">Who Am I</h2>
      <div class="content-text">
        <h3 class="system-hook" data-ru="Строю вам системы, не просто делаю видео." data-en="I build systems for you, not just make videos.">
          Строю вам системы, не просто делаю видео.
        </h3>
        <p class="sub-text">
          Оптимизирую production-процессы и внедряю AI-пайплайны для масштабирования PWA-креативов.
        </p>
      </div>
    </section>

  </main>

</body>
</html>
